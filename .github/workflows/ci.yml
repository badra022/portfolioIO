name: ci

# Runs on every pull request into develop or main and on pushes to them.
# main is protected: a release PR (develop -> main) can only merge when this passes.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      # Throwaway database: every migration is applied from scratch, so broken SQL
      # fails here instead of on the dev or production database.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TZ: Africa/Cairo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Dependencies are pinned to exact versions in package.json (no lockfile in the repo).
      - run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Validate teacher data and structured data
        run: npm run validate

      - name: Migrations apply cleanly on an empty database
        env:
          PGPASSWORD: postgres
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          # Supabase's API roles, which the migrations lock out of every table.
          psql -h localhost -U postgres -c "create role anon; create role authenticated;"
          npm run db:migrate
          # Running again must be a no-op.
          npm run db:migrate

      - name: Build
        run: npm run build

      # The MCP server as an AI agent uses it, on a throwaway teacher: small reads, edits by id,
      # dry runs, error codes, grading in bulk, image upload, a teacher's own login, the 7-day history.
      - name: MCP scenarios
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          ADMIN_USER: admin
          ADMIN_PASSWORD: ci-only-not-a-real-password
          MCP_TOKEN: ci-only-not-a-real-token-0123456789abcdef
        run: |
          npx next start -p 3000 > next.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:3000/api/cron/sweep && break; sleep 1; done
          npm run test:mcp || { cat next.log; exit 1; }
